# Same filename as the existing PyPI Trusted Publisher registration.
# No tag, push, release, PR, or workflow_run trigger can publish by itself.
name: Publish reward-lens 3.1.0 to PyPI

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable 3.1.0 release commit SHA with frozen CI artifact
        required: true
        type: string
      ci_run_id:
        description: Frozen release main CI run containing release-dist-3.1.0
        required: true
        type: string
      publisher_ci_run_id:
        description: Successful current-main CI run qualifying this publisher workflow
        required: true
        type: string
      publish:
        description: Upload to PyPI after tag exists (false only tests OIDC trust)
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: reward-lens-pypi-v3.1.0
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'reward-lens/reward-lens'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_sha256: ${{ steps.artifact.outputs.manifest_sha256 }}
      source_tree: ${{ steps.artifact.outputs.source_tree }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      PUBLISHER_CI_RUN_ID: ${{ inputs.publisher_ci_run_id }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      PUBLISHER_IMAGE_TAG: ghcr.io/pypa/gh-action-pypi-publish:dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      PUBLISHER_IMAGE_DIGEST: ghcr.io/pypa/gh-action-pypi-publish@sha256:a68d05519f6d7e47372aeaddab80b851b69afa89be179ec41775c72c4e3ab2d5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check current main and both exact all-green CI identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PUBLISHER_CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" > "$RUNNER_TEMP/ci-workflow.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" > "$RUNNER_TEMP/release-ci-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100&filter=latest" > "$RUNNER_TEMP/release-ci-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_CI_RUN_ID}" > "$RUNNER_TEMP/publisher-ci-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLISHER_CI_RUN_ID}/jobs?per_page=100&filter=latest" > "$RUNNER_TEMP/publisher-ci-jobs.json"
          python scripts/verify_publish_ci.py \
            --workflow "$RUNNER_TEMP/ci-workflow.json" \
            --release-run "$RUNNER_TEMP/release-ci-run.json" \
            --release-jobs "$RUNNER_TEMP/release-ci-jobs.json" \
            --publisher-run "$RUNNER_TEMP/publisher-ci-run.json" \
            --publisher-jobs "$RUNNER_TEMP/publisher-ci-jobs.json" \
            --release-sha "$RELEASE_SHA" --publisher-sha "$GITHUB_SHA" \
            --release-ci-run-id "$CI_RUN_ID" --publisher-ci-run-id "$PUBLISHER_CI_RUN_ID"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release ancestry, optional exact tag, and all version declarations
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          if git ls-remote --exit-code --tags origin refs/tags/v3.1.0 >/dev/null; then
            git fetch --no-tags origin refs/tags/v3.1.0:refs/tags/v3.1.0
            [[ "$(git rev-parse 'refs/tags/v3.1.0^{commit}')" == "$RELEASE_SHA" ]]
          elif [[ "$PUBLISH" == true ]]; then
            echo 'v3.1.0 tag is required for upload' >&2
            exit 1
          fi
          python - <<'PY'
          import json, pathlib, re, tomllib
          root=pathlib.Path('.')
          assert tomllib.loads((root/'pyproject.toml').read_text())['project']['version']=='3.1.0'
          assert re.search(r'^__version__ = ["\x27]3\.1\.0["\x27]$',
                           (root/'src/reward_lens/__init__.py').read_text(), re.M)
          assert json.loads((root/'frontend/package.json').read_text())['version']=='3.1.0'
          assert json.loads((root/'frontend/package-lock.json').read_text())['version']=='3.1.0'
          PY
      - name: Refuse an existing or ambiguous PyPI version
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen('https://pypi.org/pypi/reward-lens/3.1.0/json', timeout=20)
          except urllib.error.HTTPError as exc:
              if exc.code==404: raise SystemExit(0)
              raise
          raise SystemExit('reward-lens 3.1.0 already exists on PyPI; inspect hashes, do not re-upload')
          PY
      - name: Confirm exactly one nonexpired release artifact belongs to the CI run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python - <<'PY'
          import datetime, json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/artifacts.json'))
          matches=[a for a in data['artifacts'] if a['name']=='release-dist-3.1.0' and not a['expired']]
          assert len(matches)==1, f'expected one immutable release-dist artifact, got {len(matches)}'
          assert matches[0]['workflow_run']['id']==int(os.environ['CI_RUN_ID'])
          run=json.load(open(os.environ['RUNNER_TEMP']+'/release-ci-run.json'))
          started=datetime.datetime.fromisoformat(run['run_started_at'].replace('Z','+00:00'))
          created=datetime.datetime.fromisoformat(matches[0]['created_at'].replace('Z','+00:00'))
          assert created>=started, 'artifact predates the successful CI attempt'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-3.1.0
          path: checked-artifact
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact byte hashes and source binding
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('checked-artifact')
          manifest=root/'RELEASE_ARTIFACTS.json'
          m=json.loads(manifest.read_text())
          names={'reward_lens-3.1.0-py3-none-any.whl','reward_lens-3.1.0.tar.gz'}
          assert set(m['sha256'])==names
          assert {p.name for p in root.iterdir()}==names|{'RELEASE_ARTIFACTS.json','SHA256SUMS'}
          assert m['schema']=='reward-lens.release-artifacts/1' and m['version']=='3.1.0'
          assert m['repository']==os.environ['GITHUB_REPOSITORY']
          assert m['workflow']=='.github/workflows/ci.yml' and m['event']=='push'
          assert m['source_sha']==os.environ['RELEASE_SHA']
          assert m['ci_run_id']==int(os.environ['CI_RUN_ID'])
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert m['source_tree']==tree
          for name,digest in m['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('manifest_sha256='+hashlib.sha256(manifest.read_bytes()).hexdigest()+'\n')
              out.write('source_tree='+tree+'\n')
          PY
          (cd checked-artifact && sha256sum --check SHA256SUMS)
          python -m pip install --disable-pip-version-check twine
          python -m twine check checked-artifact/*.whl checked-artifact/*.tar.gz
      - name: Check exact pinned publisher image and frozen metadata without credentials
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PUBLISHER_IMAGE_TAG"
          docker image inspect --format '{{json .RepoDigests}}' "$PUBLISHER_IMAGE_TAG" > "$RUNNER_TEMP/publisher-image-digests.json"
          python - <<'PY'
          import json, os
          digests=json.load(open(os.environ['RUNNER_TEMP']+'/publisher-image-digests.json'))
          assert os.environ['PUBLISHER_IMAGE_DIGEST'] in digests, 'publisher commit-tag image digest changed'
          PY
          docker run --rm --network none --read-only \
            --mount "type=bind,src=${PWD}/checked-artifact,dst=/artifacts,readonly" \
            --entrypoint python "$PUBLISHER_IMAGE_DIGEST" -m twine check \
            /artifacts/reward_lens-3.1.0-py3-none-any.whl /artifacts/reward_lens-3.1.0.tar.gz

  preflight:
    needs: validate
    if: inputs.publish == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Mint and discard a short-lived PyPI token, with no upload
        run: python scripts/preflight_pypi_oidc.py

  upload:
    needs: validate
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reward-lens/3.1.0/
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
      PUBLISHER_IMAGE_TAG: ghcr.io/pypa/gh-action-pypi-publish:dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      PUBLISHER_IMAGE_DIGEST: ghcr.io/pypa/gh-action-pypi-publish@sha256:a68d05519f6d7e47372aeaddab80b851b69afa89be179ec41775c72c4e3ab2d5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-3.1.0
          path: checked-artifact
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck immutable bytes, exact tag, and remote collision immediately before upload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sha256sum checked-artifact/RELEASE_ARTIFACTS.json | cut -d' ' -f1)" == "$MANIFEST_SHA256" ]]
          (cd checked-artifact && sha256sum --check SHA256SUMS)
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('checked-artifact'); m=json.loads((root/'RELEASE_ARTIFACTS.json').read_text())
          assert set(m['sha256'])=={'reward_lens-3.1.0-py3-none-any.whl','reward_lens-3.1.0.tar.gz'}
          assert {p.name for p in root.iterdir()}==set(m['sha256'])|{'RELEASE_ARTIFACTS.json','SHA256SUMS'}
          for name,digest in m['sha256'].items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          PY
          tag="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v3.1.0^{}' | cut -f1)"
          if [[ -z "$tag" ]]; then
            tag="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" refs/tags/v3.1.0 | cut -f1)"
          fi
          [[ "$tag" == "$RELEASE_SHA" ]]
          python - <<'PY'
          import urllib.error,urllib.request
          try: urllib.request.urlopen('https://pypi.org/pypi/reward-lens/3.1.0/json',timeout=20)
          except urllib.error.HTTPError as exc:
              if exc.code==404: raise SystemExit(0)
              raise
          raise SystemExit('PyPI 3.1.0 collision; inspect remote identity before any retry')
          PY
          mkdir dist
          cp checked-artifact/*.whl checked-artifact/*.tar.gz dist/
          (cd dist && sha256sum --check ../checked-artifact/SHA256SUMS)
      - name: Recheck the exact publisher image and metadata before Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PUBLISHER_IMAGE_TAG"
          docker image inspect --format '{{json .RepoDigests}}' "$PUBLISHER_IMAGE_TAG" > "$RUNNER_TEMP/publisher-image-digests.json"
          python - <<'PY'
          import json, os
          digests=json.load(open(os.environ['RUNNER_TEMP']+'/publisher-image-digests.json'))
          assert os.environ['PUBLISHER_IMAGE_DIGEST'] in digests, 'publisher commit-tag image digest changed'
          PY
          docker run --rm --network none --read-only \
            --mount "type=bind,src=${PWD}/checked-artifact,dst=/artifacts,readonly" \
            --entrypoint python "$PUBLISHER_IMAGE_DIGEST" -m twine check \
            /artifacts/reward_lens-3.1.0-py3-none-any.whl /artifacts/reward_lens-3.1.0.tar.gz
      - name: Publish only those two checked bytes through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2, core metadata 2.5
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true
