name: reward-lens release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reward-lens-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Metadata, lock, static source, and tracked-file closure
        shell: bash
        run: |
          set -euo pipefail
          git show --check --format= HEAD
          python -m pip install --disable-pip-version-check uv==0.13.1 ruff==0.15.20
          uv lock --check
          ruff check src/ tests/ tools/ scripts/ hatch_build.py release/public_inputs/build_inputs.py .github/actions/reward-lens-static-validity/pre_commit.py
          ruff format --check src/ tests/ tools/ scripts/ hatch_build.py release/public_inputs/build_inputs.py .github/actions/reward-lens-static-validity/pre_commit.py
          python -m compileall -q -x '(^|/)known_wrong/' src/reward_lens
          python -m compileall -q scripts tools hatch_build.py release/public_inputs/build_inputs.py .github/actions/reward-lens-static-validity/pre_commit.py
          python -m json.tool release/validation-matrix.json > /dev/null
          python - <<'PY'
          import json, pathlib, subprocess, tomllib
          root = pathlib.Path('.')
          assert tomllib.loads((root/'pyproject.toml').read_text())['project']['version'] == '3.1.0'
          assert json.loads((root/'frontend/package.json').read_text())['version'] == '3.1.0'
          assert json.loads((root/'frontend/package-lock.json').read_text())['version'] == '3.1.0'
          assert json.loads((root/'frontend/package-lock.json').read_text())['packages']['']['version'] == '3.1.0'
          bad = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw: continue
              path = pathlib.Path(raw.decode())
              if path.is_symlink() or path.stat().st_size > 10_000_000: bad.append(str(path))
          assert not bad, bad
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Scan every tracked file against an explicitly audited baseline
        run: |
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          python scripts/check_release_secrets.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, typecheck, test both frontends, and audit npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build:report
          npm run build:workbench
          node check-audit.mjs
      - name: Rebuilt bundles match reviewed source artifacts
        run: git diff --exit-code -- src/reward_lens/render/report/assets src/reward_lens/product/serve/assets

  public-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Derive regression inputs from pinned public data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyarrow==25.0.1 numpy==2.4.6 pydantic==2.14.1 pydantic-settings==2.16.0
          builder=release/public_inputs/build_inputs.py
          raw="$(mktemp -d /tmp/rl-inputs.XXXXXX)"
          mkdir -p "$raw/e1" "$raw/rb2" validated-inputs/e1 validated-inputs/campaign
          python "$builder" eval-metadata > "$raw/eval-metadata.json"
          python "$builder" fetch-e1 "$raw/eval-metadata.json" "$raw/e1"
          python "$builder" fetch-rb2 "$raw/rb2"
          rb2_relative="$(python -c 'import json; print(json.load(open("release/public_inputs/sources.json"))["campaign"]["rewardbench2"]["path"])')"
          python "$builder" build-e1 "$raw/e1/data/train-00000-of-00001.parquet" "$raw/e1/eval_logs" validated-inputs/e1 --eval-metadata "$raw/eval-metadata.json"
          python "$builder" build-campaign validated-inputs/campaign --rb2-parquet "$raw/rb2/$rb2_relative"
          # rb2-full is an intermediate converter cache, not a tested release bank.
          rm validated-inputs/campaign/rb2-full.jsonl
          python scripts/verify_public_inputs.py --seal validated-inputs
          rm -rf "$raw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-inputs-3.1.0
          path: validated-inputs/
          if-no-files-found: error
          retention-days: 14

  cpu-dev:
    needs: public-inputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validation-inputs-3.1.0
          path: validated-inputs
      - name: Install CPU development closure
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python --torch-backend cpu . --group dev
          uv pip check --python .venv/bin/python
          uv pip freeze --python .venv/bin/python > cpu-dev-resolved.txt
          npm ci --prefix frontend
      - name: Verify public regression inputs and set portable roots
        run: .venv/bin/python scripts/verify_public_inputs.py --verify validated-inputs --github-env "$GITHUB_ENV"
      - name: Run every development suite in isolated pytest processes
        shell: bash
        run: |
          export TMPDIR="$(mktemp -d /tmp/rl-dev.XXXXXX)"
          REWARD_LENS_EXIT_CHECK=1 REWARD_LENS_SLOW=1 .venv/bin/python scripts/run_release_matrix.py dev

  cpu-all-extras:
    needs: public-inputs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validation-inputs-3.1.0
          path: validated-inputs
      - name: Install CPU all-extras closure
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1 pip-audit==2.10.1
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python --torch-backend cpu '.[all]' --group dev
          uv pip check --python .venv/bin/python
          uv pip freeze --python .venv/bin/python > cpu-all-extras-resolved.txt
          npm ci --prefix frontend
      - name: Verify public regression inputs and set portable roots
        run: .venv/bin/python scripts/verify_public_inputs.py --verify validated-inputs --github-env "$GITHUB_ENV"
      - name: Audit installed Python dependency set
        shell: bash
        run: |
          set -euo pipefail
          site="$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          pip-audit --vulnerability-service osv --strict --path "$site"
      - name: Run every inventoried product and offline regression suite
        shell: bash
        run: |
          export TMPDIR="$(mktemp -d /tmp/rl-all.XXXXXX)"
          REWARD_LENS_EXIT_CHECK=1 REWARD_LENS_SLOW=1 .venv/bin/python scripts/run_release_matrix.py all_extras

  trl-110-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact supported TRL conformance version on CPU
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --torch-backend cpu '.[all]' --group dev 'trl==1.10.0'
          uv pip check --python .venv/bin/python
          uv pip freeze --python .venv/bin/python > trl-110-resolved.txt
      - name: Run TRL 1.10.0 conformance profile
        run: REWARD_LENS_EXIT_CHECK=1 REWARD_LENS_SLOW=1 .venv/bin/python scripts/run_release_matrix.py trl_110

  trl-113-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact supported TRL tap version on CPU
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --torch-backend cpu '.[all]' --group dev 'trl==1.13.0'
          uv pip check --python .venv/bin/python
          uv pip freeze --python .venv/bin/python > trl-113-resolved.txt
      - name: Run TRL 1.13.0 tap conformance profile
        run: REWARD_LENS_EXIT_CHECK=1 REWARD_LENS_SLOW=1 .venv/bin/python scripts/run_release_matrix.py trl_113

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Strict documentation build and local link checks
        run: |
          python -m pip install --disable-pip-version-check -r docs/requirements-docs.txt
          python -m pip install --disable-pip-version-check '.[verifier]'
          mkdocs build --strict -f docs/mkdocs.yml
          python scripts/verify_release_docs.py

  package:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build and inspect canonical distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine 'hatchling>=1.27'
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
          python scripts/verify_release_archives.py dist
      - name: Build a wheel from the sdist with no Node on PATH
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          tar -xzf dist/reward_lens-3.1.0.tar.gz -C "$scratch"
          pybin="$(dirname "$(command -v python)")"
          PATH="$pybin" python -m build --wheel --no-isolation --outdir "$scratch/rebuilt" "$scratch/reward_lens-3.1.0"
          python -m twine check "$scratch"/rebuilt/*.whl
      - name: Verify clean base wheel outside all checkouts
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          python scripts/verify_release_install.py --wheel "$PWD/dist/reward_lens-3.1.0-py3-none-any.whl" --work-dir "$scratch/clean-install"
      - name: Bind archive bytes to source and this CI run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          dist=pathlib.Path('dist')
          names=('reward_lens-3.1.0-py3-none-any.whl','reward_lens-3.1.0.tar.gz')
          hashes={name:hashlib.sha256((dist/name).read_bytes()).hexdigest() for name in names}
          manifest={'schema':'reward-lens.release-artifacts/1','version':'3.1.0',
                    'repository':os.environ['GITHUB_REPOSITORY'],
                    'workflow':'.github/workflows/ci.yml','event':os.environ['GITHUB_EVENT_NAME'],
                    'source_sha':os.environ['GITHUB_SHA'],
                    'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                    'ci_run_id':int(os.environ['GITHUB_RUN_ID']),'sha256':hashes}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==manifest['source_sha']
          (dist/'RELEASE_ARTIFACTS.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          (dist/'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name,digest in sorted(hashes.items())))
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-dist-3.1.0
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release-ready:
    needs: [source-quality, secrets, frontend, public-inputs, cpu-dev, cpu-all-extras, trl-110-conformance, trl-113-conformance, docs, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validation-dist-3.1.0
          path: checked-artifact
      - name: Freeze only the exact package-validated bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('checked-artifact')
          m=json.loads((root/'RELEASE_ARTIFACTS.json').read_text())
          assert m['repository']==os.environ['GITHUB_REPOSITORY']
          assert m['source_sha']==os.environ['GITHUB_SHA'] and m['event']=='push'
          assert m['ci_run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert set(root.iterdir())=={root/n for n in (*m['sha256'],'SHA256SUMS','RELEASE_ARTIFACTS.json')}
          for name,digest in m['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, name
          PY
          (cd checked-artifact && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-3.1.0
          path: checked-artifact/
          if-no-files-found: error
          retention-days: 30
